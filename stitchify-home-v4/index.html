const FAQ_GROUPS = [
  {
    group: "Getting started",
    icon: "home",
    items: [
      {
        q: "What is Stitchify?",
        a: "Stitchify lets independent fashion designers and brands manufacture apparel through our vetted OEM partner factories, then promote those finished products with real creators. Everything runs from one account \u2014 you don't need separate tools for production and marketing."
      },
      {
        q: "Who is Stitchify for?",
        a: "Independent designers launching their first run, and established brands who want a faster route from sample to shelf. You don't need an existing factory relationship or a minimum order history to start."
      },
      {
        q: "What does the Home screen show me?",
        a: "Home leads with Today's Actions \u2014 the small number of things genuinely waiting on you, ordered by urgency. Below that are summary cards for Make, Showroom and Recorded Funds, then a table of your most recent products."
      },
      {
        q: "Why do some actions have a red or amber dot?",
        a: "Red means time-sensitive \u2014 something expires or someone is blocked waiting on you. Amber means it needs attention soon. Grey is informational and can wait."
      }
    ]
  },
  {
    group: "Make \u2014 production",
    icon: "sewing",
    items: [
      {
        q: "How does manufacturing work?",
        a: "You submit a product spec, we match it to suitable OEM partners from our onboarded network, and they return quotes. You review a quote, approve it, and production begins. You then track the order through Ordered, Production, Inspection, Shipping and Delivered."
      },
      {
        q: "How long is a quote valid?",
        a: "Most factory quotes hold for 7 days. The exact expiry is shown on the project card and you'll get a reminder before it lapses. Once a quote expires you can request a fresh one, though pricing may have moved."
      },
      {
        q: "What are the minimum order quantities?",
        a: "MOQs vary by factory and garment type \u2014 typically from 20 to 50 pieces per style. The quote will state the MOQ for that specific partner. If a factory's MOQ doesn't suit you, we'll match you to another."
      },
      {
        q: "Can I order a sample before full production?",
        a: "Yes. Sampling is a separate, smaller order placed before the main run. It's the recommended path for a first product, and the sampling cost is shown separately in Recorded Funds."
      },
      {
        q: "What do the five production stages mean?",
        a: "Ordered \u2014 the factory has accepted and scheduled your run. Production \u2014 garments are being made. Inspection \u2014 quality check against your spec. Shipping \u2014 in transit to you. Delivered \u2014 received and added to your inventory."
      }
    ]
  },
  {
    group: "Showroom \u2014 promotion",
    icon: "showroom",
    items: [
      {
        q: "What is Showroom?",
        a: "Showroom is where you run promotional campaigns with creators \u2014 influencers, photographers and models. You post a campaign, creators apply, you choose who to work with, and payment is held until the work is delivered."
      },
      {
        q: "Why can I only use Make-manufactured items?",
        a: "Showroom campaigns are restricted to products made through Stitchify so we can verify the item exists, confirm stock, and stand behind what creators are asked to promote. This protects both you and the creator."
      },
      {
        q: "How do I choose between creator types?",
        a: "Influencers post to their own audience \u2014 best for reach. Photographers deliver usable image assets \u2014 best for your own channels. Models appear in a shoot you direct \u2014 best when you need controlled brand imagery. You can select more than one type on a campaign."
      },
      {
        q: "What's the difference between Gifting and Rental?",
        a: "Gifting means the creator keeps the item. Rental means it's returned after the shoot, which suits higher-value pieces or limited stock. Rental campaigns need return shipping factored into your timeline."
      },
      {
        q: "When am I charged for a campaign?",
        a: "You're charged when you approve a creator, not when you publish. Funds are held and released to the creator once deliverables are submitted and you've confirmed them."
      },
      {
        q: "What if a creator doesn't deliver?",
        a: "If deliverables aren't submitted by the deadline, the campaign is flagged and held funds are returned to you. Contact support through the chat button on any screen and we'll step in."
      }
    ]
  },
  {
    group: "Sales, inventory & funds",
    icon: "salesinv",
    items: [
      {
        q: "Is 'Recorded Funds' my bank balance?",
        a: "No \u2014 and this is important. Recorded Funds is an operational estimate built from transactions recorded inside Stitchify: sales you've logged, production payments, and campaign fees. It does not connect to your bank and won't reflect external income or expenses."
      },
      {
        q: "Why might Recorded Funds look wrong?",
        a: "The usual cause is a sale recorded without a linked product, or spending that happened outside Stitchify and was never entered. Unlinked records appear as an action on your Home screen so you can reconcile them."
      },
      {
        q: "How does inventory update?",
        a: "Stock increases automatically when a Make order reaches Delivered. It decreases when you record a sale. You can also adjust counts manually if something is damaged, gifted, or sold through a channel you don't log here."
      },
      {
        q: "What triggers a low-stock alert?",
        a: "An item is flagged when its remaining stock falls to a level that won't cover typical demand while a reorder is in production. Flagged rows are highlighted in Sales & Inventory and surface as an action on Home."
      }
    ]
  },
  {
    group: "Account & billing",
    icon: "profile",
    items: [
      {
        q: "Can I add my team?",
        a: "Yes. Profile \u2192 Team lets you invite members as Admin (full access except billing) or Viewer (read-only). The Owner role can't be transferred from the interface \u2014 contact support if you need that changed."
      },
      {
        q: "How am I billed?",
        a: "There's no subscription. You pay per production order and per campaign, charged to your saved card at the point you approve. Every charge appears in Profile \u2192 Billing with a downloadable invoice."
      },
      {
        q: "When is Design launching?",
        a: "Design \u2014 tech packs, sketches, materials and measurements feeding straight into a Make order \u2014 is in active development. Turn on notifications from the Design page and we'll tell you when it opens."
      }
    ]
  }
